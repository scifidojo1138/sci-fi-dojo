<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon-lp-favicon.ico">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-lp-favicon-96x96.png">
<link rel="icon" type="image/svg+xml" href="favicon-lp-favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-lp-apple-touch-icon.png">
<link rel="manifest" href="favicon-lp-site.webmanifest">
<title>Sci-Fi Dojo — The Return of Movie Night</title>
<meta name="description" content="Video rental in Belmar, NJ. Sci-fi, cult, and hidden gems on DVD, Blu-ray, and 4K UHD. Inside Vintage on Ninth, 903 Main Street. Thursday-Sunday 12-5pm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* --cyan/--orange are sampled directly from logo.png (the real brand
   asset) -- #ff6b35 also matches the app's existing --accent2. Both are
   too light/low-contrast for body text on white, so they're used only
   in the logo image and as decorative accents (divider), never as
   small text or a button fill. */
:root {
  --white:    #ffffff;
  --cyan:     #00d4ff;
  --orange:   #ff6b35;
  --ink:      #14181f;
  --ink-mid:  #4b5563;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: var(--white);
  color: var(--ink);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
.wrap { max-width: 520px; width:100%; text-align:center; }

.logo-img {
  width: 100%;
  max-width: 420px;
  height: auto;
  margin-bottom: 40px;
}

.section-label {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.desc {
  font-size: 14px;
  color: var(--ink-mid);
  line-height: 1.7;
  max-width: 400px;
  margin: 0 auto 40px;
}

.divider {
  width: 44px;
  height: 3px;
  background: var(--orange);
  margin: 0 auto 40px;
  border-radius: 2px;
}

.details { margin-bottom: 40px; font-size: 14px; line-height: 1.9; color: var(--ink); }
.details strong { font-weight: 700; }

.btn {
  display: inline-block;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--white);
  background: var(--ink);
  padding: 13px 28px;
  border-radius: 999px;
  transition: transform .15s ease, opacity .15s ease;
}
.btn:hover { transform: translateY(-1px); opacity: .92; }

footer {
  margin-top: 44px;
  font-size: 11px;
  color: #c2c8d1;
}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo-img" src="logo.png" alt="Sci-Fi Dojo — The Return of Movie Night">

  <div class="section-label">Video Rental</div>
  <p class="desc">Sci-fi, cult, and hidden gems on DVD, Blu-ray, and 4K UHD.</p>

  <div class="divider"></div>

  <p class="details">
    Find us inside <strong>Vintage On Ninth</strong><br>
    903 Main Street, Belmar, NJ<br>
    Thursday &ndash; Sunday, 12&ndash;5pm
  </p>

  <a class="btn" href="https://www.instagram.com/scifi_dojo" target="_blank" rel="noopener">Follow on Instagram</a>

  <!-- v2026.08.06 -->
  <footer>v2026.08.06</footer>
</div>
</body>
</html>
