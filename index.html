<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon-lp-favicon.ico">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-lp-favicon-96x96.png">
<link rel="icon" type="image/svg+xml" href="favicon-lp-favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-lp-apple-touch-icon.png">
<link rel="manifest" href="favicon-lp-site.webmanifest">
<title>Sci-Fi Dojo — The Return of Movie Night</title>
<meta name="description" content="Video rental in Belmar, NJ. Sci-fi, cult, and hidden gems on DVD, Blu-ray, and 4K UHD. Inside Vintage on Ninth, 903 Main Street. Thursday-Sunday 12-5pm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* --cyan/--orange are sampled directly from logo.png (the real brand
   asset) -- #ff6b35 also matches the app's existing --accent2. Both are
   too light/low-contrast for body text on white, so they're used only
   in the logo image and as decorative accents (divider), never as
   small text or a button fill. */
:root {
  --white:    #ffffff;
  --cyan:     #00d4ff;
  --orange:   #ff6b35;
  --ink:      #14181f;
  --ink-mid:  #4b5563;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: var(--white);
  color: var(--ink);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
.wrap { max-width: 520px; width:100%; text-align:center; }

.logo-img {
  width: 100%;
  max-width: 420px;
  height: auto;
  margin-bottom: 40px;
}

.section-label {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.desc {
  font-size: 14px;
  color: var(--ink-mid);
  line-height: 1.7;
  max-width: 400px;
  margin: 0 auto 40px;
}

.divider {
  width: 44px;
  height: 3px;
  background: var(--orange);
  margin: 0 auto 40px;
  border-radius: 2px;
}

/* Photo carousel -- self-hiding: the inline script at the bottom of this
   file probes gallery/1.jpg, gallery/2.jpg, ... and only builds this
   markup for the ones that actually load, so an empty /gallery folder
   renders nothing at all rather than a broken/empty box. Gaps in the
   numbering are fine. See gallery/README.md. */
.gallery { margin: 0 auto 40px; max-width: 320px; }
.gallery-viewport {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border-radius: 10px;
  background: #f2f3f5;
}
.gallery-track {
  display: flex;
  height: 100%;
  transition: transform .4s ease;
}
.gallery-track img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  flex: 0 0 100%;
}
.gallery-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,.88);
  color: var(--ink);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
.gallery-arrow.prev { left: 10px; }
.gallery-arrow.next { right: 10px; }
.gallery-dots { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
.gallery-dot {
  width: 6px;
  height: 6px;
  padding: 0;
  border: none;
  border-radius: 3px;
  background: #d8dce3;
  cursor: pointer;
  transition: width .2s ease, background .2s ease;
}
.gallery-dot.active { width: 18px; background: var(--orange); }

.details { margin-bottom: 40px; font-size: 14px; line-height: 1.9; color: var(--ink); }
.details strong { font-weight: 700; }

.btn {
  display: inline-block;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--white);
  background: var(--ink);
  padding: 13px 28px;
  border-radius: 999px;
  transition: transform .15s ease, opacity .15s ease;
}
.btn:hover { transform: translateY(-1px); opacity: .92; }

.von-note {
  margin-top: 24px;
  font-size: 12px;
  color: var(--ink-mid);
}
.von-note a { color: var(--ink-mid); }

footer {
  margin-top: 44px;
  font-size: 11px;
  color: #c2c8d1;
}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo-img" src="logo.png" alt="Sci-Fi Dojo — The Return of Movie Night">

  <div class="section-label">Video Rental</div>
  <p class="desc">Sci-fi, cult, and hidden gems on DVD, Blu-ray, and 4K UHD.</p>

  <div id="gallery-mount"></div>

  <div class="divider"></div>

  <p class="details">
    Find us inside <strong>Vintage On Ninth</strong><br>
    903 Main Street, Belmar, NJ<br>
    Thursday &ndash; Sunday, 12&ndash;5pm
  </p>

  <a class="btn" href="https://www.instagram.com/scifi_dojo" target="_blank" rel="noopener">Follow SFD on Instagram</a>

  <p class="von-note">For additional hours &amp; events, check out <a href="https://www.instagram.com/vintageonninth/" target="_blank" rel="noopener">Vintage On Ninth on Instagram</a>.</p>

  <!-- v2026.08.08 -->
  <footer>v2026.08.08</footer>
</div>

<script>
// Photo carousel: probes gallery/1.jpg, gallery/2.jpg, ... up to
// GALLERY_MAX and only renders slides for the ones that actually load
// (see gallery/README.md). No matches -- e.g. the folder is still
// empty -- means this whole section quietly renders nothing.
(function () {
  var GALLERY_MAX = 10;
  var mount = document.getElementById('gallery-mount');
  if (!mount) return;

  function loadImage(src) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(src); };
      img.onerror = function () { resolve(null); };
      img.src = src;
    });
  }

  var probes = [];
  for (var n = 1; n <= GALLERY_MAX; n++) probes.push(loadImage('gallery/' + n + '.jpg'));

  Promise.all(probes).then(function (results) {
    var srcs = results.filter(Boolean);
    if (!srcs.length) return;
    renderGallery(srcs);
  });

  function renderGallery(srcs) {
    var multi = srcs.length > 1;
    mount.innerHTML =
      '<div class="gallery">' +
        '<div class="gallery-viewport">' +
          '<div class="gallery-track">' +
            srcs.map(function (s) { return '<img src="' + s + '" alt="Sci-Fi Dojo" loading="lazy">'; }).join('') +
          '</div>' +
          (multi ?
            '<button class="gallery-arrow prev" aria-label="Previous photo">&#8249;</button>' +
            '<button class="gallery-arrow next" aria-label="Next photo">&#8250;</button>'
            : '') +
        '</div>' +
        (multi ? '<div class="gallery-dots"></div>' : '') +
      '</div>';

    var i = 0;
    var viewport = mount.querySelector('.gallery-viewport');
    var track = mount.querySelector('.gallery-track');
    var dotsWrap = mount.querySelector('.gallery-dots');
    var dots = [];

    if (dotsWrap) {
      srcs.forEach(function (_, idx) {
        var d = document.createElement('button');
        d.className = 'gallery-dot' + (idx === 0 ? ' active' : '');
        d.setAttribute('aria-label', 'Go to photo ' + (idx + 1));
        d.addEventListener('click', function () { go(idx); restart(); });
        dotsWrap.appendChild(d);
        dots.push(d);
      });
    }

    function go(idx) {
      i = (idx + srcs.length) % srcs.length;
      track.style.transform = 'translateX(-' + (i * 100) + '%)';
      dots.forEach(function (d, di) { d.classList.toggle('active', di === i); });
    }

    var prevBtn = mount.querySelector('.gallery-arrow.prev');
    var nextBtn = mount.querySelector('.gallery-arrow.next');
    if (prevBtn) prevBtn.addEventListener('click', function () { go(i - 1); restart(); });
    if (nextBtn) nextBtn.addEventListener('click', function () { go(i + 1); restart(); });

    // Swipe must be clearly HORIZONTAL to count. Measuring only dx meant
    // an ordinary vertical page scroll that happened to start on the
    // photo -- easy on a phone, where this 3:4 box fills much of the
    // screen -- would drift 40px sideways, advance the slide, and (with
    // the old stop-and-never-restart behavior) kill autoplay for the
    // rest of the visit.
    var startX = null, startY = null;
    viewport.addEventListener('touchstart', function (e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    viewport.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      var dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? i + 1 : i - 1); restart(); }
      startX = startY = null;
    });

    var timer = null;
    // start() is guarded so it can never stack two intervals; restart()
    // gives a fresh full interval after a manual move, so the carousel
    // doesn't jump again a moment after the visitor picked a slide.
    function start()   { if (multi && !timer) timer = setInterval(function () { go(i + 1); }, 4500); }
    function stop()    { if (timer) { clearInterval(timer); timer = null; } }
    function restart() { stop(); if (!hovering) start(); }

    // Hover-to-pause only on devices that actually hover. Wiring it
    // unconditionally left touch users permanently paused: a tap fires a
    // synthetic mouseenter whose matching mouseleave doesn't arrive
    // until they tap somewhere else.
    //
    // Bound to the whole .gallery, not just the photo -- the dots sit
    // outside .gallery-viewport, so pausing on the viewport alone meant
    // reaching for a dot un-paused the carousel and it could advance out
    // from under the click.
    var hovering = false;
    var root = mount.querySelector('.gallery');
    if (root && window.matchMedia && window.matchMedia('(hover: hover)').matches) {
      root.addEventListener('mouseenter', function () { hovering = true;  stop();  });
      root.addEventListener('mouseleave', function () { hovering = false; start(); });
    }
    start();
  }
})();
</script>
</body>
</html>
