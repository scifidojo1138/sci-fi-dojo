<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon-lp-favicon.ico">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-lp-favicon-96x96.png">
<link rel="icon" type="image/svg+xml" href="favicon-lp-favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-lp-apple-touch-icon.png">
<link rel="manifest" href="favicon-lp-site.webmanifest">
<title>Sci-Fi Dojo — The Return of Movie Night</title>
<meta name="description" content="Video rental in Belmar, NJ. Sci-fi, cult, and hidden gems on DVD, Blu-ray, and 4K UHD. Inside Vintage on Ninth, 903 Main Street. Thursday-Sunday 12-5pm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* --blue/--orange are read off the printed card photo (indoor lighting,
   so treat as close-but-approximate) -- swap for exact brand hex if the
   logo file ever ships with a spec. */
:root {
  --white:    #ffffff;
  --blue:     #0e7490;
  --orange:   #b8420c;
  --ink:      #14181f;
  --ink-mid:  #4b5563;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: var(--white);
  color: var(--ink);
  font-family: 'Share Tech Mono', monospace;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
.wrap { max-width: 520px; width:100%; text-align:center; }

/* Interim text wordmark -- swap for the real logo image when it's ready:
   <img src="/logo.svg" alt="Sci-Fi Dojo" style="max-width:280px;">
   in place of the .logo div below. Two-tone treatment matches the
   printed card: "Sci-Fi" teal-blue, "Dojo" rust-orange, tight kerning. */
.logo {
  font-family: 'Orbitron', sans-serif;
  font-weight: 900;
  font-size: clamp(38px, 10vw, 62px);
  line-height: 1;
  letter-spacing: -.01em;
  margin-bottom: 12px;
}
.logo .sci { color: var(--blue); }
.logo .dojo { color: var(--orange); }

.tagline-main {
  font-size: clamp(15px, 3vw, 18px);
  color: var(--ink);
  letter-spacing: .01em;
  margin-bottom: 44px;
}

.section-label {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.desc {
  font-size: 14px;
  color: var(--ink-mid);
  line-height: 1.7;
  max-width: 400px;
  margin: 0 auto 40px;
}

.divider {
  width: 44px;
  height: 3px;
  background: var(--orange);
  margin: 0 auto 40px;
  border-radius: 2px;
}

.details { margin-bottom: 40px; font-size: 14px; line-height: 1.9; color: var(--ink); }
.details strong { font-weight: 700; }

.btn {
  display: inline-block;
  font-family: 'Share Tech Mono', monospace;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--white);
  background: var(--blue);
  padding: 13px 28px;
  border-radius: 999px;
  transition: transform .15s ease, opacity .15s ease;
}
.btn:hover { transform: translateY(-1px); opacity: .92; }

footer {
  margin-top: 44px;
  font-size: 11px;
  color: #c2c8d1;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span class="sci">Sci-Fi</span><span class="dojo">Dojo</span></div>
  <div class="tagline-main">The Return of Movie Night</div>

  <div class="section-label">Video Rental</div>
  <p class="desc">Sci-fi, cult, and hidden gems on DVD, Blu-ray, and 4K UHD.</p>

  <div class="divider"></div>

  <p class="details">
    Find us inside <strong>Vintage On Ninth</strong><br>
    903 Main Street, Belmar, NJ<br>
    Thursday &ndash; Sunday, 12&ndash;5pm
  </p>

  <a class="btn" href="https://www.instagram.com/scifi_dojo" target="_blank" rel="noopener">Follow on Instagram</a>

  <!-- v2026.08.06 -->
  <footer>v2026.08.06</footer>
</div>
</body>
</html>
